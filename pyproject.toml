# Pacote Python da SPA — empacotado com package-data para o sync_dist.py/B5.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopforge-ade"
version = "0.1.0"
description = "LoopForge ADE — frontend SPA servido pelo backend ADE"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loopforge_ade = ["static/dist/**/*"]
